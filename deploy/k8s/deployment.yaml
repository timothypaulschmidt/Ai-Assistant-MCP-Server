apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app.kubernetes.io/name: mcp-server
spec:
  # One copy: the data is generated per pod, so more copies would each hold their own.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        # Matches `useradd --uid 10001 appuser` in the Dockerfile
        runAsUser: 10001
      containers:
        - name: mcp-server
          # The tag is set in kustomization.yaml (images:)
          image: timothypaulschmidt/ai-assistant-mcp-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # The image defaults to safe. This lab wants the unsafe tools, so say so here,
            # where it is visible. Change to "safe" and re-apply to switch.
            - name: MCP_MODE
              value: "vulnerable"
            - name: LAB_DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
            # The root filesystem is read-only, but Python (openpyxl writes the Excel
            # file through a temp file) needs a writable /tmp.
            - name: tmp
              mountPath: /tmp
          # Generating the fake data on first start takes a few seconds, so give the
          # container time before the other probes begin. (TCP probes: the /mcp URL
          # answers GET with an error by design, so an HTTP probe would never pass.)
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        # Temporary on purpose: deleting the pod throws the data away and the next start
        # regenerates it from the seed. That is how you reset the lab after a demo:
        #   kubectl -n ai-assistant rollout restart deployment/mcp-server
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  labels:
    app.kubernetes.io/name: mcp-server
spec:
  # ClusterIP: reachable only from inside the cluster, as http://mcp-server:8000/mcp.
  # Deliberately NOT a NodePort or Ingress: this server has unsafe tools.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
    - name: http
      port: 8000
      targetPort: http

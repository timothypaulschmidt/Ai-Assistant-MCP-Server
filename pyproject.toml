[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant-mcp-server"
version = "0.1.0"
description = "Intentionally vulnerable MCP server with synthetic data, for AI security demos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "faker>=30",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-assistant-mcp-server = "ai_assistant_mcp_server.server:main"
fake-corp-generate = "ai_assistant_mcp_server.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
